[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bnbu-portal-mcp"
version = "0.1.0"
description = "MCP server + CLI for BNBU iSpace (Moodle): courses, assignments, deadlines, files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "genshinkleenahida" }]
keywords = ["mcp", "moodle", "bnbu", "ispace", "model-context-protocol", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.25",
  "keyring>=24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/genshinkleenahida/bnbu-portal-mcp"
Repository = "https://github.com/genshinkleenahida/bnbu-portal-mcp"
Issues = "https://github.com/genshinkleenahida/bnbu-portal-mcp/issues"

[project.scripts]
portal-mcp = "portal_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portal_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
